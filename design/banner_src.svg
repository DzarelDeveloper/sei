<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 720" width="1920" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#0f3d8a"/>
      <stop offset="0.55" stop-color="#1a5fd0"/>
      <stop offset="1" stop-color="#2b74e6"/>
    </linearGradient>
    <pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#ffffff" opacity="0.10"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bad2f8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#bad2f8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- latar -->
  <rect width="1920" height="720" fill="url(#bg)"/>
  <rect width="1920" height="720" fill="url(#dots)"/>

  <!-- S handwritten raksasa (path sama dengan logo resmi) -->
  <g transform="translate(120 150) scale(6.6) rotate(-6 32 32)" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.96">
    <path d="M43 19C42.5 12.5 33 9.5 26 12c-7.5 2.7-9.5 9.5-4.5 13.5 4.5 3.7 16 3.1 20.5 7.5 5.5 5.4 1 13.5-8 15-7.5 1.3-14-1.5-15.5-6.5"/>
  </g>

  <!-- jalur eksplorasi: kurva putus-putus dari S menuju maskot -->
  <path d="M560 470 C 760 300, 900 610, 1080 430 S 1360 260, 1520 380"
        fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="2 26" opacity="0.85"/>

  <!-- node ikon -->
  <g stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- toga / kelulusan -->
    <g transform="translate(700 352)">
      <circle r="44" fill="#ffffff" stroke="none"/>
      <g stroke="#1a5fd0">
        <path d="M-24 -4 L0 -16 L24 -4 L0 8 Z" fill="#1a5fd0" stroke="#1a5fd0"/>
        <path d="M-13 3 V15 C-13 21 13 21 13 15 V3"/>
        <path d="M24 -4 V14"/>
      </g>
    </g>
    <!-- kompas -->
    <g transform="translate(920 508)">
      <circle r="44" fill="#ffffff" stroke="none"/>
      <g stroke="#1a5fd0">
        <circle r="26" fill="none"/>
        <path d="M-9 9 L-3 -3 L9 -9 L3 3 Z" fill="#1a5fd0" stroke="#1a5fd0"/>
      </g>
    </g>
    <!-- palet desain -->
    <g transform="translate(1140 372)">
      <circle r="44" fill="#ffffff" stroke="none"/>
      <g stroke="#1a5fd0">
        <path d="M-22 4 C-26 -14 -10 -26 8 -24 C26 -22 30 -6 22 4 C18 9 20 14 14 16 C2 20 -16 16 -22 4 Z" fill="none"/>
        <circle cx="-8" cy="-10" r="3.4" fill="#1a5fd0" stroke="none"/>
        <circle cx="6" cy="-14" r="3.4" fill="#1a5fd0" stroke="none"/>
        <circle cx="14" cy="-2" r="3.4" fill="#1a5fd0" stroke="none"/>
      </g>
    </g>
    <!-- jaringan -->
    <g transform="translate(1350 300)">
      <circle r="44" fill="#ffffff" stroke="none"/>
      <g stroke="#1a5fd0">
        <circle cx="0" cy="-18" r="6" fill="#1a5fd0" stroke="none"/>
        <circle cx="-18" cy="14" r="6" fill="#1a5fd0" stroke="none"/>
        <circle cx="18" cy="14" r="6" fill="#1a5fd0" stroke="none"/>
        <path d="M0 -12 L-15 9 M0 -12 L15 9 M-13 14 L13 14"/>
      </g>
    </g>
  </g>

  <!-- glow + maskot asli aplikasi -->
  <ellipse cx="1660" cy="430" rx="330" ry="330" fill="url(#glow)"/>
  <image href="public/images/sei/boy-welcome.png" x="1360" y="90" width="600" height="600"
         preserveAspectRatio="xMidYMid meet"/>
</svg>
