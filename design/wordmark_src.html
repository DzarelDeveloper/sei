<!doctype html>
<meta charset="utf-8" />
<style>
  @font-face {

    font-weight: 200 800;

  html, body { margin: 0; }
  .card {
    position: relative;
    width: 1600px; height: 520px;
    background: #0a0a0a;
    overflow: hidden;
    display: grid; place-items: center;
    font-family: 'PJS', sans-serif;
  }
  .noise { position: absolute; inset: 0; opacity: .07; }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 62% 55% at 50% 46%, rgba(255,255,255,.06), transparent 70%);
  }
  .stack { position: relative; text-align: center; }
  .word {
    display: inline-flex; align-items: center; gap: 10px;
    color: #fff; font-weight: 800; font-size: 250px; line-height: 1;
    letter-spacing: 4px;
  }
  .word svg { display: block; }
  .sub {
    margin-top: 26px;
    color: rgba(255,255,255,.78);
    font-weight: 500; font-size: 30px;
    letter-spacing: 14px; text-indent: 14px;
  }
</style>
