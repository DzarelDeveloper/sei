    <noscript>
      <h1>SEI — Self Exploration Intelligence</h1>
      <p>
        SEI adalah alat refleksi gratis untuk siswa SMP, SMA, dan SMK yang sedang
        harus memilih jalur pendidikan. Kenali minat lewat asesmen berbahasa
        Indonesia, lihat skor pada lima bidang (perangkat lunak, jaringan,
        desain, sains, elektronika), jelajahi kurikulum mini tiap bidang, lalu
        bandingkan jalur SMA, SMK, kerja, dan kuliah termasuk informasi beasiswa.
      </p>
      <p>
        SEI bukan tes bakat dan tidak mengklaim validitas psikometrik. Aplikasi
        berjalan tanpa akun dan tanpa backend; jawabanmu tersimpan di perangkatmu
        sendiri. Mode AI bersifat opsional dan memakai API key milikmu sendiri.
      </p>
      <p>
